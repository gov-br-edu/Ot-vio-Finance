<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otávio Finance | Dashboard Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #05070a; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); color: #f1f5f9; overflow-x: hidden; }
        .area-animada { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 30% 20%, #1e1b4b 0%, #05070a 100%); }
        .diamante { position: absolute; color: rgba(165, 180, 252, 0.1); font-size: 24px; pointer-events: none; animation: flutuar linear infinite; }
        @keyframes flutuar { 0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 2.5rem; }
        .input-elegant { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); @apply w-full px-6 py-4 rounded-[1.8rem] text-white outline-none transition-all duration-300; }
        .input-elegant:focus { @apply border-indigo-500 ring-4 ring-indigo-500/10 bg-black; }
        .btn-elegant { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); @apply text-white font-bold py-4 rounded-[1.8rem] hover:scale-[1.02] active:scale-[0.98] transition-all shadow-xl shadow-indigo-500/20 disabled:opacity-20; }
        .btn-delete { @apply text-rose-500 hover:text-rose-300 transition-colors p-2 text-lg opacity-40 hover:opacity-100; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="antialiased min-h-screen pb-20">

    <div class="area-animada" id="particles"></div>

    <!-- LOGIN -->
    <div id="login-overlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#05070a]">
        <div class="glass-card p-10 w-full max-w-md text-center mx-4 border-indigo-500/20 border-2">
            <h2 class="text-3xl font-black mb-6 italic tracking-tighter text-white uppercase text-indigo-400">Autenticação</h2>
            <input type="password" id="input-senha" placeholder="Senha" class="input-elegant text-center mb-4">
            <button onclick="validarSenha()" class="btn-elegant w-full">Entrar</button>
            <p id="login-erro" class="text-rose-500 text-xs mt-4 hidden">Incorreto.</p>
        </div>
    </div>

    <!-- CONTEÚDO -->
    <div id="conteudo-site" class="max-w-7xl mx-auto px-6 py-10 relative hidden">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6">
            <div>
                <h1 class="text-5xl font-black tracking-tighter text-white">Otávio <span class="text-indigo-400 font-light">Finance</span></h1>
            </div>
            <div class="glass-card p-3 flex items-center gap-3 font-bold">
                <select id="filtro-mes" onchange="carregarDados()" class="bg-transparent text-white px-4 py-2 outline-none">
                    <option class="text-black" value="01">Jan</option><option class="text-black" value="02">Fev</option><option class="text-black" value="03">Mar</option><option class="text-black" value="04">Abr</option><option class="text-black" value="05">Mai</option><option class="text-black" value="06">Jun</option><option class="text-black" value="07">Jul</option><option class="text-black" value="08">Ago</option><option class="text-black" value="09">Set</option><option class="text-black" value="10">Out</option><option class="text-black" value="11">Nov</option><option class="text-black" value="12">Dez</option>
                </select>
                <input type="number" id="filtro-ano" onchange="carregarDados()" value="2024" class="bg-transparent text-white px-4 py-2 w-24 outline-none">
            </div>
        </header>

        <!-- KPI -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12 text-center">
            <div class="glass-card p-8 border-l-4 border-indigo-500"><p class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-2">Lucro Líquido</p><h3 id="dash-lucro" class="text-3xl font-bold italic">R$ 0,00</h3></div>
            <div class="glass-card p-8 border-l-4 border-emerald-500"><p class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest mb-2 text-white">Vendas</p><h3 id="dash-vendas" class="text-3xl font-bold">R$ 0,00</h3></div>
            <div class="glass-card p-8 border-l-4 border-amber-500"><p class="text-[10px] font-bold text-amber-400 uppercase tracking-widest mb-2 text-white">Estoque</p><h3 id="dash-estoque" class="text-3xl font-bold">R$ 0,00</h3></div>
            <div class="glass-card p-8 border-l-4 border-rose-500"><p class="text-[10px] font-bold text-rose-400 uppercase tracking-widest mb-2 text-white">Despesas</p><h3 id="dash-gastos" class="text-3xl font-bold">R$ 0,00</h3></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- INPUTS -->
            <div class="lg:col-span-4 space-y-8">
                <div class="glass-card p-8"><h2 class="text-xl font-bold mb-6 text-indigo-400">Nova Compra</h2>
                    <form id="compraForm" class="space-y-4">
                        <input type="text" id="c-desc" placeholder="Joia" class="input-elegant" required>
                        <div class="grid grid-cols-2 gap-4"><input type="number" step="0.01" id="c-custo" placeholder="Custo" class="input-elegant" required><input type="number" step="0.01" id="c-desloc" placeholder="Frete" class="input-elegant" required></div>
                        <input type="date" id="c-data" class="input-elegant" required><button type="submit" class="btn-elegant w-full">Salvar</button>
                    </form>
                </div>
                <div class="glass-card p-8 border-indigo-500/10 border-2">
                    <h2 class="text-xl font-bold mb-4 text-emerald-400 italic">Venda Agrupada</h2>
                    <div id="venda-selecionados" class="space-y-2 my-4"></div>
                    <form id="vendaForm" class="space-y-4 pt-4 border-t border-white/5">
                        <div class="flex justify-between font-bold"><span class="text-xs text-slate-400">CUSTO:</span><span id="venda-custo-total" class="text-indigo-400 font-mono">R$ 0,00</span></div>
                        <input type="date" id="v-data" class="input-elegant" required><input type="number" step="0.01" id="v-valor" placeholder="Venda Total" class="input-elegant" required>
                        <button type="submit" id="btn-venda" disabled class="btn-elegant w-full !bg-emerald-600">Concluir</button>
                    </form>
                </div>
                <div class="glass-card p-8"><h2 class="text-xl font-bold mb-6 text-rose-400 uppercase tracking-tighter">Despesa Geral</h2>
                    <form id="despesaForm" class="space-y-4">
                        <input type="text" id="d-desc" placeholder="Descrição" class="input-elegant" required><input type="number" step="0.01" id="d-valor" placeholder="Valor" class="input-elegant" required><input type="date" id="d-data" class="input-elegant" required><button type="submit" class="btn-elegant w-full !from-rose-600 !to-rose-500">Salvar Gasto</button>
                    </form>
                </div>
            </div>

            <!-- TABELAS -->
            <div class="lg:col-span-8 space-y-8">
                <div class="glass-card overflow-hidden">
                    <div class="px-8 py-5 bg-white/5 font-bold tracking-widest text-indigo-400 border-b border-white/5 uppercase">Estoque Ativo</div>
                    <div class="max-h-80 overflow-y-auto"><table class="w-full text-left text-sm"><tbody id="lista-estoque" class="divide-y divide-white/5"></tbody></table></div>
                </div>

                <div class="glass-card overflow-hidden">
                    <div class="px-8 py-5 bg-white/5 font-bold tracking-widest text-emerald-400 border-b border-white/5 uppercase">Vendas Realizadas</div>
                    <div class="max-h-80 overflow-y-auto"><table class="w-full text-left text-xs"><tbody id="lista-vendas" class="divide-y divide-white/5"></tbody></table></div>
                </div>

                <div class="glass-card overflow-hidden">
                    <div class="px-8 py-5 bg-white/5 font-bold tracking-widest text-rose-400 border-b border-white/5 uppercase">Gastos Diversos</div>
                    <div class="max-h-60 overflow-y-auto"><table class="w-full text-left text-xs"><tbody id="lista-despesas" class="divide-y divide-white/5"></tbody></table></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-12">
            <div class="glass-card p-8"><canvas id="chartFinance" height="250"></canvas></div>
            <div class="glass-card p-8"><canvas id="chartPie" height="250"></canvas></div>
        </div>
    </div>

    <script>
        const SB_URL = "https://ufadejgqyyziimcootee.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmYWRlamdxeXl6aWltY29vdGVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMjcwMjMsImV4cCI6MjA5NDkwMzAyM30.AP8NQBqnYQ8vEtT3ypOms3oLPVsFWahRBr-Bg0zEy5M";
        const SENHA_MESTRA = "1903";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);
        let estoqueLocal = [], selecionados = [], chart1, chart2;
        const hoje = new Date().toISOString().split('T')[0];

        function validarSenha() {
            if(document.getElementById('input-senha').value === SENHA_MESTRA) {
                localStorage.setItem('acesso_otavio', 'true');
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('conteudo-site').classList.remove('hidden');
                carregarDados();
            } else document.getElementById('login-erro').classList.remove('hidden');
        }

        window.onload = () => {
            if(localStorage.getItem('acesso_otavio') === 'true') {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('conteudo-site').classList.remove('hidden');
                carregarDados();
            }
            criarParticulas();
        };

        document.querySelectorAll('input[type="date"]').forEach(el => el.value = hoje);
        document.getElementById('filtro-ano').value = new Date().getFullYear();
        document.getElementById('filtro-mes').value = String(new Date().getMonth() + 1).padStart(2, '0');

        async function carregarDados() {
            const mes = document.getElementById('filtro-mes').value;
            const ano = document.getElementById('filtro-ano').value;
            const ultimoDia = new Date(ano, mes, 0).getDate();
            const { data: estoque } = await _supabase.from('estoque').select('*').eq('vendido', false).order('id', { ascending: false });
            const { data: vendas } = await _supabase.from('vendas').select('*').gte('data', `${ano}-${mes}-01`).lte('data', `${ano}-${mes}-${ultimoDia}`).order('data', { ascending: false });
            const { data: despesas } = await _supabase.from('despesas').select('*').gte('data', `${ano}-${mes}-01`).lte('data', `${ano}-${mes}-${ultimoDia}`).order('data', { ascending: false });
            estoqueLocal = estoque || [];
            renderizar(estoqueLocal, vendas || [], despesas || []);
            renderCharts(vendas || [], despesas || []);
        }

        function renderizar(estoque, vendas, despesas) {
            const listEstoque = document.getElementById('lista-estoque');
            const listVendas = document.getElementById('lista-vendas');
            const listDespesas = document.getElementById('lista-despesas');
            const areaSel = document.getElementById('venda-selecionados');
            listEstoque.innerHTML = ''; listVendas.innerHTML = ''; listDespesas.innerHTML = ''; areaSel.innerHTML = '';
            let kpiLucro = 0, kpiVendas = 0, kpiEstoque = 0, kpiGastos = 0;

            estoque.forEach(item => {
                kpiEstoque += (item.custo + item.deslocamento);
                const isSel = selecionados.includes(item.id);
                listEstoque.innerHTML += `
                    <tr class="${isSel ? 'bg-indigo-500/10' : ''}">
                        <td class="px-8 py-4 font-bold text-slate-200">${item.descricao}</td>
                        <td class="px-8 py-4 font-bold text-indigo-400 text-right">R$ ${(item.custo + item.deslocamento).toFixed(2)}</td>
                        <td class="px-4 text-right">
                            <button onclick="toggleSelecao(${item.id})" class="px-4 py-2 rounded-2xl text-[10px] font-black uppercase tracking-tighter ${isSel ? 'bg-indigo-600 text-white' : 'bg-white/5 text-indigo-400'}">${isSel ? 'Remover' : 'Selecionar'}</button>
                            <button onclick="deletarRegistro('estoque', ${item.id})" class="btn-delete ml-2">🗑️</button>
                        </td>
                    </tr>`;
                if(isSel) areaSel.innerHTML += `<div class="flex justify-between bg-white/5 p-4 rounded-2xl border border-white/5 text-xs text-indigo-400 font-bold uppercase tracking-widest"><span>${item.descricao}</span><span>R$ ${(item.custo + item.deslocamento).toFixed(2)}</span></div>`;
            });

            vendas.forEach(v => {
                kpiVendas += v.valor_venda; kpiLucro += v.lucro;
                listVendas.innerHTML += `<tr><td class="px-8 py-5 text-slate-500 font-mono">${v.data.split('-').reverse().join('/')}</td><td class="px-8 py-5 text-slate-200 font-medium">${v.itens_desc}</td><td class="px-8 py-5 text-right font-bold text-white">R$ ${v.valor_venda.toFixed(2)}</td><td class="px-8 py-5 text-right font-bold text-emerald-400">R$ ${v.lucro.toFixed(2)}</td><td class="px-4 text-right"><button onclick="confirmarExclusaoVenda(${v.id}, '${v.itens_desc}')" class="btn-delete">🗑️</button></td></tr>`;
            });

            despesas.forEach(d => {
                kpiGastos += d.valor;
                listDespesas.innerHTML += `<tr><td class="px-8 py-4 text-slate-500 font-mono">${d.data.split('-').reverse().join('/')}</td><td class="px-8 py-4 text-slate-200 font-medium">${d.descricao}</td><td class="px-8 py-4 text-right font-bold text-rose-400">- R$ ${d.valor.toFixed(2)}</td><td class="px-4 text-right"><button onclick="deletarRegistro('despesas', ${d.id})" class="btn-delete">🗑️</button></td></tr>`;
            });

            document.getElementById('dash-lucro').innerText = `R$ ${(kpiLucro - kpiGastos).toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('dash-vendas').innerText = `R$ ${kpiVendas.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('dash-estoque').innerText = `R$ ${kpiEstoque.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('dash-gastos').innerText = `R$ ${kpiGastos.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            let custoV = 0; selecionados.forEach(id => { const i = estoqueLocal.find(item => item.id === id); if(i) custoV += (i.custo + i.deslocamento); });
            document.getElementById('venda-custo-total').innerText = `R$ ${custoV.toFixed(2)}`;
            document.getElementById('btn-venda').disabled = selecionados.length === 0;
        }

        async function deletarRegistro(tabela, id) {
            if(confirm("Excluir este registro permanentemente?")) {
                await _supabase.from(tabela).delete().eq('id', id); carregarDados();
            }
        }

        async function confirmarExclusaoVenda(vendaId, nomesItens) {
            const acao = confirm(`EXCLUSÃO DE VENDA:\n\nClique em OK para excluir a venda e DEVOLVER os itens (${nomesItens}) ao estoque.\nClique em CANCELAR para apenas excluir o registro da venda definitivamente.`);
            
            if (acao) {
                // Devolver para o estoque (procura itens pelos nomes e marca como não vendido)
                const nomesArray = nomesItens.split(" + ");
                for(let nome of nomesArray) {
                    await _supabase.from('estoque').update({ vendido: false }).eq('descricao', nome).eq('vendido', true);
                }
            }
            // Independente da escolha de devolver ou não, o registro da venda é apagado
            await _supabase.from('vendas').delete().eq('id', vendaId);
            carregarDados();
        }

        function renderCharts(vendas, despesas) {
            const ctx1 = document.getElementById('chartFinance').getContext('2d'), ctx2 = document.getElementById('chartPie').getContext('2d');
            if(chart1) chart1.destroy(); if(chart2) chart2.destroy();
            let lV = vendas.reduce((acc, v) => acc + v.lucro, 0), dT = despesas.reduce((acc, d) => acc + d.valor, 0), vT = vendas.reduce((acc, v) => acc + v.valor_venda, 0);
            chart1 = new Chart(ctx1, { type: 'bar', data: { labels: ['Bruto', 'Gastos', 'Líquido'], datasets: [{ data: [vT, dT, (lV-dT)], backgroundColor: ['#6366f1', '#f43f5e', '#10b981'], borderRadius: 12 }] }, options: { plugins: { legend: { display: false } }, scales: { y: { grid: { display: false }, ticks: { color: '#64748b' } }, x: { grid: { display: false }, ticks: { color: '#64748b' } } } } });
            chart2 = new Chart(ctx2, { type: 'doughnut', data: { labels: ['Custo', 'Gastos', 'Lucro'], datasets: [{ data: [(vT-lV), dT, (lV-dT)], backgroundColor: ['#1e293b', '#f43f5e', '#10b981'], borderWidth: 0 }] }, options: { plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } } });
        }

        async function toggleSelecao(id) {
            const idx = selecionados.indexOf(id); if (idx > -1) selecionados.splice(idx, 1); else selecionados.push(id);
            carregarDados();
        }

        document.getElementById('compraForm').onsubmit = async (e) => {
            e.preventDefault();
            await _supabase.from('estoque').insert([{ descricao: document.getElementById('c-desc').value, custo: parseFloat(document.getElementById('c-custo').value), deslocamento: parseFloat(document.getElementById('c-desloc').value), data: document.getElementById('c-data').value }]);
            e.target.reset(); document.getElementById('c-data').value = hoje; carregarDados();
        };

        document.getElementById('vendaForm').onsubmit = async (e) => {
            e.preventDefault(); const valV = parseFloat(document.getElementById('v-valor').value); let cT = 0, n = [];
            for(let id of selecionados) { const i = estoqueLocal.find(it => it.id === id); cT += (i.custo + i.deslocamento); n.push(i.descricao); await _supabase.from('estoque').update({ vendido: true }).eq('id', id); }
            await _supabase.from('vendas').insert([{ data: document.getElementById('v-data').value, itens_desc: n.join(" + "), valor_venda: valV, lucro: valV - cT }]);
            selecionados = []; e.target.reset(); document.getElementById('v-data').value = hoje; carregarDados();
        };

        document.getElementById('despesaForm').onsubmit = async (e) => {
            e.preventDefault();
            await _supabase.from('despesas').insert([{ descricao: document.getElementById('d-desc').value, valor: parseFloat(document.getElementById('d-valor').value), data: document.getElementById('d-data').value }]);
            e.target.reset(); document.getElementById('d-data').value = hoje; carregarDados();
        };

        function criarParticulas() {
            const c = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div'); p.className = 'diamante'; p.innerText = '💎';
                p.style.left = Math.random() * 100 + 'vw'; p.style.animationDuration = (Math.random() * 10 + 12) + 's';
                c.appendChild(p);
            }
        }
    </script>
</body>
</html>
